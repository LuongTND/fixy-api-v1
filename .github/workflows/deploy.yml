name: Deploy FIXY API to Azure

on:
  push:
    branches:
      - master

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'fixy-api-v1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore FIXY.sln

      # 4. Build ở chế độ Release
      - name: Build
        run: dotnet build FIXY.sln --configuration Release --no-restore

      # 5. Publish ra thư mục deploy
      - name: Publish
        run: dotnet publish API/API.csproj --configuration Release --no-build --output ./publish

      # 6. Deploy lên Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
